services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mon-app:latest          # ← correspond à IMAGE_NAME dans le Jenkinsfile
    container_name: mon-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      
    networks:
      - app-network
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
